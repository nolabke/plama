<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAMA. — Koszulki z nadrukowaną plamą</title>
<style>
  :root{
    --cream:#f4ede1;
    --cream-2:#eee3d0;
    --ink:#2a2118;
    --ink-soft:#5c4d3c;
    --coffee:#6b4226;
    --ketchup:#a4291f;
    --mustard:#c98a1f;
    --wine:#5e2233;
    --line:#d8c8ab;
    --card:#fffaf0;
    --accent:#c98a1f;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Segoe UI", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:Georgia, "Times New Roman", serif;
    margin:0 0 .4em 0;
    color:var(--ink);
  }
  a{color:inherit;}
  img,svg{display:block;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  /* NAV */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(244,237,225,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex;align-items:center;justify-content:space-between;
    height:72px;
    gap:16px;
  }
  .logo{
    font-family:Georgia, serif;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:.02em;
    display:flex;align-items:center;gap:8px;
    flex-shrink:0;
  }
  .logo .dot-stain{width:16px;height:14px;border-radius:60% 40% 55% 45% / 50% 55% 45% 50%;background:var(--coffee);display:inline-block;transform:rotate(-8deg);}
  nav ul{list-style:none;display:flex;gap:28px;margin:0;padding:0;}
  nav ul a{text-decoration:none;font-size:.95rem;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  nav ul a:hover{color:var(--ink);}
  .nav-right{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .langswitch{position:relative;}
  .lang-current{
    display:flex;align-items:center;gap:7px;
    background:var(--card);border:1px solid var(--line);
    padding:9px 14px;border-radius:999px;
    font-size:.82rem;font-weight:700;letter-spacing:.02em;
    color:var(--ink);cursor:pointer;
  }
  .lang-current:hover{border-color:var(--ink-soft);}
  .lang-chevron{transition:transform .18s ease;flex-shrink:0;}
  .langswitch.open .lang-chevron{transform:rotate(180deg);}
  .lang-menu{
    position:absolute;top:calc(100% + 8px);right:0;
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:6px;min-width:150px;
    box-shadow:0 18px 40px -14px rgba(42,33,24,.35);
    display:flex;flex-direction:column;gap:2px;
    opacity:0;visibility:hidden;transform:translateY(-6px);
    transition:opacity .16s ease, transform .16s ease, visibility .16s;
    z-index:60;
  }
  .langswitch.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0);}
  .lang-menu button{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;text-align:left;border:none;background:transparent;
    padding:9px 12px;border-radius:9px;
    font-size:.88rem;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .lang-menu button:hover{background:var(--cream-2);color:var(--ink);}
  .lang-menu button.active{background:var(--ink);color:var(--cream);}
  .lang-menu button .check{opacity:0;}
  .lang-menu button.active .check{opacity:1;}
  .cart{
    position:relative;
    display:flex;align-items:center;gap:6px;
    background:var(--ink);color:var(--cream);
    padding:9px 16px;border-radius:999px;
    font-weight:700;font-size:.85rem;
    border:none;cursor:pointer;white-space:nowrap;
  }
  .cart .badge{
    background:var(--ketchup);color:#fff;
    border-radius:999px;min-width:18px;height:18px;
    font-size:.7rem;display:flex;align-items:center;justify-content:center;
    padding:0 4px;
  }

  /* HERO */
  .hero{
    padding:76px 0 60px;
    position:relative;
    overflow:hidden;
  }
  .hero .wrap{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:48px;
    align-items:center;
  }
  .eyebrow{
    display:inline-block;
    background:var(--card);
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(2.1rem, 4.2vw, 3.3rem);
    line-height:1.08;
    max-width:16ch;
  }
  .hero h1 em{
    font-style:normal;
    color:var(--ketchup);
    text-decoration:underline wavy var(--mustard) 3px;
    text-underline-offset:6px;
  }
  .hero p.lead{
    font-size:1.12rem;
    color:var(--ink-soft);
    max-width:46ch;
    margin:18px 0 28px;
  }
  .btnrow{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;
    border-radius:999px;
    font-weight:700;
    font-size:.98rem;
    text-decoration:none;
    cursor:pointer;
    border:2px solid var(--ink);
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--ink);color:var(--cream);}
  .btn-ghost{background:transparent;color:var(--ink);}
  .trust{margin-top:26px;font-size:.85rem;color:var(--ink-soft);display:flex;gap:10px;align-items:center;}
  .stars{color:var(--mustard);letter-spacing:2px;}

  .hero-visual{
    position:relative;
    aspect-ratio:1/1.05;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 24px 50px -20px rgba(42,33,24,.25);
  }
  .tshirt{
    width:72%;
    position:relative;
  }
  .tshirt svg{width:100%;height:auto;}
  .hero-tag{
    position:absolute;
    background:var(--ink);color:var(--cream);
    font-size:.72rem;font-weight:700;
    padding:6px 10px;border-radius:8px;
    transform:rotate(-6deg);
  }
  .hero-tag.t1{top:14%;left:6%;}
  .hero-tag.t2{bottom:12%;right:4%;transform:rotate(4deg);background:var(--ketchup);}

  /* STRIP */
  .strip{
    background:var(--ink);
    color:var(--cream);
    padding:12px 0;
    overflow:hidden;
    white-space:nowrap;
  }
  .strip-inner{
    display:inline-flex;gap:48px;
    animation:marquee 22s linear infinite;
    font-weight:700;font-size:.85rem;letter-spacing:.04em;
    text-transform:uppercase;
  }
  .strip-inner span{opacity:.85;}
  @keyframes marquee{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }

  /* SECTIONS */
  section{padding:76px 0;}
  .section-head{max-width:640px;margin:0 auto 44px;text-align:center;}
  .section-head .eyebrow{margin-bottom:14px;}
  .section-head h2{font-size:clamp(1.7rem,3vw,2.3rem);}
  .section-head p{color:var(--ink-soft);font-size:1.02rem;}

  /* HOW IT WORKS */
  .steps{
    display:grid;grid-template-columns:repeat(3,1fr);gap:28px;
  }
  .step{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 26px;position:relative;
  }
  .step .num{
    width:38px;height:38px;border-radius:50%;
    background:var(--ink);color:var(--cream);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;margin-bottom:18px;
  }
  .step h3{font-size:1.15rem;}
  .step p{color:var(--ink-soft);font-size:.95rem;margin:0;}
  .step-quote{
    margin-top:16px;font-style:italic;color:var(--wine);
    font-size:.88rem;border-left:3px solid var(--mustard);padding-left:10px;
  }

  /* PRODUCTS */
  .filters{display:flex;gap:10px;justify-content:center;margin-bottom:34px;flex-wrap:wrap;}
  .filter{
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:.82rem;font-weight:600;color:var(--ink-soft);
    cursor:default;
  }
  .grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 18px 34px -18px rgba(42,33,24,.35);}
  .card-media{
    aspect-ratio:1/1;
    background:var(--cream-2);
    position:relative;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .card-media .shirt-base{width:78%;}
  .badge-tag{
    position:absolute;top:10px;left:10px;
    background:var(--ink);color:var(--cream);
    font-size:.68rem;font-weight:700;
    padding:4px 9px;border-radius:6px;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .badge-tag.hot{background:var(--ketchup);}
  .badge-tag.new{background:var(--mustard);color:var(--ink);}
  .card-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-body h3{font-size:1.05rem;margin:0;}
  .card-body .desc{font-size:.85rem;color:var(--ink-soft);min-height:2.6em;}
  .card-foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:auto;padding-top:10px;
    gap:10px;
  }
  .price{font-weight:700;font-size:1.05rem;}
  .add-btn{
    background:var(--ink);color:var(--cream);border:none;
    padding:9px 14px;border-radius:999px;font-weight:700;font-size:.8rem;
    cursor:pointer;white-space:nowrap;
  }
  .add-btn:hover{background:var(--ketchup);}
  .stock{font-size:.72rem;color:var(--ink-soft);opacity:.85;}

  /* TESTIMONIALS */
  .testi-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  }
  .testi{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px;
  }
  .testi .stars{display:block;margin-bottom:10px;}
  .testi p{font-size:.94rem;color:var(--ink);}
  .testi .who{margin-top:14px;font-size:.82rem;color:var(--ink-soft);font-weight:600;}

  /* BANNER */
  .banner{
    background:var(--wine);color:var(--cream);
    border-radius:24px;
    padding:52px 44px;
    display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center;
  }
  .banner h2{color:var(--cream);font-size:clamp(1.5rem,3vw,2rem);}
  .banner p{color:#e9d9dd;font-size:.98rem;}
  .banner .btn-primary{background:var(--cream);color:var(--ink);border-color:var(--cream);}

  /* FAQ */
  .faq{max-width:760px;margin:0 auto;}
  .qa{
    border-bottom:1px solid var(--line);
    padding:20px 4px;
  }
  .qa summary{
    cursor:pointer;font-weight:700;font-size:1rem;
    list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .qa summary::-webkit-details-marker{display:none;}
  .qa summary::after{content:"+";font-size:1.4rem;color:var(--ink-soft);transition:transform .2s;}
  .qa[open] summary::after{transform:rotate(45deg);}
  .qa p{color:var(--ink-soft);margin:12px 0 0;font-size:.94rem;}

  /* FOOTER */
  footer{
    background:var(--ink);color:var(--cream);
    padding:56px 0 28px;
    margin-top:40px;
  }
  .foot-grid{
    display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px;
    padding-bottom:36px;border-bottom:1px solid rgba(244,237,225,.15);
  }
  footer h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:#d8c8ab;margin:0 0 14px;}
  footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;}
  footer ul a{text-decoration:none;color:#e7ddca;font-size:.9rem;}
  footer ul a:hover{color:#fff;}
  footer p.tagline{color:#cbb99a;font-size:.9rem;max-width:34ch;}
  .foot-bottom{
    padding-top:22px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
    font-size:.78rem;color:#a9997d;
  }

  /* TOAST */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,120%);
    background:var(--ink);color:var(--cream);
    padding:14px 22px;border-radius:12px;
    font-size:.9rem;font-weight:600;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.4);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    z-index:100;
    max-width:88vw;
  }
  #toast.show{transform:translate(-50%,0);}

  @media (max-width:940px){
    .hero .wrap{grid-template-columns:1fr;}
    .steps{grid-template-columns:1fr;}
    .grid{grid-template-columns:repeat(2,1fr);}
    .testi-grid{grid-template-columns:1fr;}
    .banner{grid-template-columns:1fr;}
    .foot-grid{grid-template-columns:1fr 1fr;}
    nav ul{display:none;}
  }
  @media (max-width:560px){
    .grid{grid-template-columns:1fr;}
    .foot-grid{grid-template-columns:1fr;}
    .lang-menu{right:auto;left:0;}
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <div class="logo"><span class="dot-stain"></span> PLAMA.</div>
    <ul>
      <li><a href="#sklep" id="navShop">Sklep</a></li>
      <li><a href="#jak-to-dziala" id="navHow">Jak to działa</a></li>

        </div>
      </div>
      <button class="cart" id="cartBtn">🛒 <span id="cartLabel">Koszyk</span> <span class="badge" id="cartCount">0</span></button>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow" id="heroEyebrow">Odzież prewencyjna od 2019 r.</span>
      <h1 id="heroH1">Nikt nie zapyta o <em>tę</em> plamę,<br>jeśli zobaczy tę plamę.</h1>
      <p class="lead" id="heroLead"></p>
      <div class="btnrow">
        <a href="#sklep" class="btn btn-primary" id="btnPrimary">Zobacz kolekcję</a>
        <a href="#jak-to-dziala" class="btn btn-ghost" id="btnGhost">Jak to działa?</a>

    </div>
    <div class="hero-visual">
      <span class="hero-tag t1" id="heroTag1">100% udawane</span>
      <span class="hero-tag t2" id="heroTag2">Made to embarrass nobody</span>
      <div class="tshirt" id="heroShirt"></div>
    </div>
  </div>
</section>

<div class="strip">
  <div class="strip-inner" id="stripInner"></div>
</div>

<section id="jak-to-dziala">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="stepsEyebrow"></span>
      <h2 id="stepsH2"></h2>
      <p id="stepsSub"></p>
    </div>
    <div class="steps" id="stepsGrid"></div>
  </div>
</section>

<section id="sklep">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="shopEyebrow"></span>
      <h2 id="shopH2"></h2>
      <p id="shopSub"></p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="productGrid"></div>
  </div>
</section>

<section id="opinie" style="background:var(--cream-2);">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="testiEyebrow"></span>
      <h2 id="testiH2"></h2>
    </div>
    <div class="testi-grid" id="testiGrid"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="banner">
      <div>
        <h2 id="bannerH2"></h2>
        <p id="bannerP"></p>
      </div>
      <a href="#faq" class="btn btn-primary" style="justify-self:start;" id="bannerCta"></a>
    </div>
  </div>
</section>

<section id="faq">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" id="faqEyebrow"></span>
      <h2 id="faqH2"></h2>
    </div>
    <div class="faq" id="faqList"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="logo" style="color:var(--cream);margin-bottom:12px;"><span class="dot-stain" style="background:var(--mustard);"></span> PLAMA.</div>
        <p class="tagline" id="footTagline"></p>
      </div>
      <div>
        <h4 id="footH1"></h4>
        <ul id="footList1"></ul>
      </div>
      <div>
        <h4 id="footH2"></h4>
        <ul id="footList2"></ul>
      </div>
      <div>
        <h4 id="footH3"></h4>
        <ul id="footList3"></ul>
      </div>
    </div>
    <div class="foot-bottom">
      <span id="footBottom1"></span>
      <span id="footBottom2"></span>
    </div>
  </div>
</footer>

<div id="toast"></div>

  let currentLang = 'pl';
  let cartCount = 0;

  // ---------- Stain SVG generator ----------
  function stainSVG(color, ringColor, seed, size){
    size = size || 220;
    function rnd(n){ return (Math.sin(seed*999 + n*57.13) + 1)/2; }
    const cx = size/2, cy = size/2;
    const points = 10;
    const baseR = size*0.30;
    let path = "";
    let pts = [];
    for(let i=0;i<points;i++){
      const angle = (Math.PI*2/points)*i;
      const r = baseR * (0.72 + rnd(i)*0.55);
      const x = cx + Math.cos(angle)*r;
      const y = cy + Math.sin(angle)*r*0.92;
      pts.push([x,y]);
    }
    path += `M ${pts[0][0]} ${pts[0][1]} `;
    for(let i=0;i<points;i++){
      const p0 = pts[i];
      const p1 = pts[(i+1)%points];
      const mx = (p0[0]+p1[0])/2 + (rnd(i+20)-0.5)*18;
      const my = (p0[1]+p1[1])/2 + (rnd(i+40)-0.5)*18;
      path += `Q ${mx} ${my} ${p1[0]} ${p1[1]} `;
    }
    path += "Z";

    const dAngle = rnd(99)*Math.PI*2;
    const dx = cx + Math.cos(dAngle)*(baseR*1.35);
    const dy = cy + Math.sin(dAngle)*(baseR*1.1);
    const dr = size*0.045 + rnd(88)*size*0.03;

    return `
    <svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">
      <defs>
        <filter id="rough-${seed}" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.1" />
        </filter>
      </defs>
      <ellipse cx="${cx}" cy="${cy}" rx="${baseR*1.28}" ry="${baseR*1.12}" fill="${ringColor}" opacity="0.28"/>
      <path d="${path}" fill="${ringColor}" opacity="0.55" filter="url(#rough-${seed})"/>
      <path d="${path}" fill="${color}" transform="translate(${cx},${cy}) scale(0.82) translate(${-cx},${-cy})" filter="url(#rough-${seed})"/>
      <circle cx="${dx}" cy="${dy}" r="${dr}" fill="${color}" opacity="0.85"/>
      <circle cx="${dx}" cy="${dy}" r="${dr*1.6}" fill="${ringColor}" opacity="0.25"/>
    </svg>`;
  }

  function tshirtSVG(innerContent, shirtColor){
    shirtColor = shirtColor || "#fffaf0";
    return `
    <svg viewBox="0 0 300 320" width="100%" height="100%">
      <path d="M100 18 L60 40 L20 90 L55 118 L78 100 L78 300 L222 300 L222 100 L245 118 L280 90 L240 40 L200 18
               C200 40 172 54 150 54 C128 54 100 40 100 18 Z"
            fill="${shirtColor}" stroke="#d8c8ab" stroke-width="4" stroke-linejoin="round"/>
      <g transform="translate(96,112) scale(0.5)">
        ${innerContent}
      </g>
    </svg>`;
  }

  function starString(n){
    return "★".repeat(n) + "☆".repeat(5-n);
  }

  // ---------- Render ----------
  function render(lang){
    currentLang = lang;
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.title = t.title;

    // lang switch button + menu
    document.getElementById('langCurrentLabel').textContent = lang.toUpperCase();
    document.querySelectorAll('#langMenu button').forEach(b=>{
      b.classList.toggle('active', b.dataset.lang === lang);
    });

    // nav

    document.getElementById('heroH1').innerHTML = t.hero.h1;
    document.getElementById('heroLead').textContent = t.hero.lead;
    document.getElementById('btnPrimary').textContent = t.hero.btnPrimary;
    document.getElementById('btnGhost').textContent = t.hero.btnGhost;
    document.getElementById('trustText').textContent = t.hero.trust;
    document.getElementById('heroTag1').textContent = t.hero.tag1;
    document.getElementById('heroTag2').textContent = t.hero.tag2;
    document.getElementById('heroShirt').innerHTML = tshirtSVG(stainSVG("#a4291f","#e07a5f", 42, 160));

    const words = t.strip.concat(t.strip);
    document.getElementById('stripInner').innerHTML = words.map(w=>`<span>${w}</span>`).join('');

    document.getElementById('stepsEyebrow').textContent = t.steps.eyebrow;
    document.getElementById('stepsH2').textContent = t.steps.h2;
    document.getElementById('stepsSub').textContent = t.steps.sub;
    document.getElementById('stepsGrid').innerHTML = t.steps.items.map((s,i)=>`
      <div class="step">
        <div class="num">${i+1}</div>

        <p>${s.desc}</p>

    const grid = document.getElementById('productGrid');

    document.getElementById('faqEyebrow').textContent = t.faq.eyebrow;
    document.getElementById('faqH2').textContent = t.faq.h2;
    document.getElementById('faqList').innerHTML = t.faq.items.map((qa,i)=>`
      <details class="qa" ${i===0 ? 'open' : ''}>
        <summary>${qa.q}</summary>

    // footer
    document.getElementById('footTagline').textContent = t.footer.tagline;
    document.getElementById('footH1').textContent = t.footer.h1;
    document.getElementById('footH2').textContent = t.footer.h2;
    document.getElementById('footH3').textContent = t.footer.h3;

    document.getElementById('footList3').innerHTML = t.footer.list3.map(l=>`<li><a href="#jak-to-dziala">${l}</a></li>`).join('');

    document.getElementById('footBottom2').textContent = t.footer.bottom2;
  }

  // ---------- Cart + toast ----------
  const cartCountEl = document.getElementById('cartCount');
  const toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=> toast.classList.remove('show'), 2600);
  }

  // ---------- Language dropdown open/close ----------
  const langSwitchEl = document.getElementById('langSwitch');
  const langCurrentBtn = document.getElementById('langCurrentBtn');

  function openLangMenu(){
    langSwitchEl.classList.add('open');
    langCurrentBtn.setAttribute('aria-expanded', 'true');
  }
  function closeLangMenu(){
    langSwitchEl.classList.remove('open');
    langCurrentBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleLangMenu(){
    langSwitchEl.classList.contains('open') ? closeLangMenu() : openLangMenu();
  }

  document.addEventListener('click', (e)=>{
    const langOption = e.target.closest('#langMenu button');
    if(langOption){
      render(langOption.dataset.lang);
      closeLangMenu();
      return;
    }
    if(e.target.closest('#langCurrentBtn')){
      toggleLangMenu();
      return;
    }
    if(!e.target.closest('#langSwitch')){
      closeLangMenu();
    }
    const btn = e.target.closest('.add-btn');
    if(btn){
      cartCount++;
      cartCountEl.textContent = cartCount;
      const t = I18N[currentLang];
      const msg = t.toast.messages[Math.floor(Math.random()*t.toast.messages.length)];
      showToast(`“${btn.dataset.name}” — ${msg}`);
      return;
    }
    if(e.target.closest('#cartBtn')){
      const t = I18N[currentLang];
      showToast(cartCount === 0 ? t.toast.empty : t.toast.hasItems(cartCount));
    }
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeLangMenu();
  });

  // ---------- Default language: browser/device settings ----------
 
  function detectDefaultLang(){
    const supported = ['pl', 'en', 'de'];
    const candidates = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || 'pl'];
    for(const c of candidates){
      const code = String(c).toLowerCase().split('-')[0];
      if(supported.includes(code)) return code;
    }
    return 'pl';
  }

  render(detectDefaultLang());
</script>
